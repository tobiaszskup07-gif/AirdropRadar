[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airdropradar-kit"
version = "0.1.0"
description = "Validate and filter airdrop announcement datasets"
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}

[tool.setuptools]
packages = ["airdropkit"]

[project.scripts]
airdropkit = "airdropkit:main"
